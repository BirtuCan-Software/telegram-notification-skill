name: Deployment with Telegram Notifications (Script Mode)

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

concurrency:
  group: "deploy-${{ github.ref_name }}"
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy Application
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
      DEPLOY_URL: ${{ vars.DEPLOY_URL }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: "🔔 Telegram: Notify Deployment Started"
        id: tg_start
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          chmod +x ./scripts/telegram-notify.sh
          ./scripts/telegram-notify.sh start

      - name: ⚙️ Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install Dependencies & Run Tests
        run: |
          npm ci
          npm test --if-present

      - name: 🏗️ Build Production Artifacts
        run: npm run build

      - name: 🚀 Deploy Application
        run: |
          echo "Deploying to production target..."

      - name: "🔔 Telegram: Notify Deployment Finished"
        if: always() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          chmod +x ./scripts/telegram-notify.sh
          ./scripts/telegram-notify.sh finish "${{ job.status }}" "${{ steps.tg_start.outputs.message_id }}" "${{ steps.tg_start.outputs.start_time }}"
